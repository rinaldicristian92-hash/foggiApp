        /* ==========================================================================
           2. STATO GLOBALE E MULTILINGUA
           ========================================================================== */
        let currentLanguage = localStorage.getItem('app_lang') || 'IT';
        function initLanguage() {
            setLanguage(currentLanguage);
            
            // Event Listeners pulsanti lingua
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const lang = e.target.getAttribute('data-lang');
                    if(lang !== currentLanguage) setLanguage(lang);
                });
            });
        }
        function setLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('app_lang', lang);
            // Aggiorna UI testi hardcoded
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (TRANSLATIONS[lang][key]) {

            document.getElementById('current-lang-badge').textContent = lang;
            // Aggiorna classi pulsanti lingua
            document.querySelectorAll('.lang-btn').forEach(btn => {
                if(btn.getAttribute('data-lang') === lang) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            // Ricarica il testo del riquadro 4
            loadTextContent();

        /* ==========================================================================
           3. GESTIONE FETCH TESTO (RIQUADRO 4)
           ========================================================================== */
        async function loadTextContent() {
            const textContainer = document.getElementById('text-content');
            textContainer.innerHTML = `<div class="loader">${TRANSLATIONS[currentLanguage].loading}</div>`;
            const fileName = currentLanguage === 'IT' ? 'txt/storia_foggia.txt' : 'txt/storia_foggia_en.txt';
            try {
                const response = await fetch(fileName);
                if (!response.ok) throw new Error('File not found');
                let text = await response.text();
                
                // Formattazione base del file txt (sostituisce i ritorni a capo con <br>)
                text = text.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
                textContainer.innerHTML = `<p>${text}</p>`;
            } catch (error) {
                // FALLBACK: Inserimento del testo direttamente nel codice
                console.warn("Fetch fallito o assente. Caricamento testo integrato.");
                
                const fallbackIT = `
                    <h2>Il Cappellone delle Croci</h2>
                    <p>La costruzione della chiesa risale al 1693 e venne eretta sul luogo in cui il padre cappuccino Antonio da Olivadi piantò sette croci lungo il percorso di una processione penitenziale[1]. Tale Via Crucis venne fatta per scongiurare la carestia che imperversava nel Tavoliere delle Puglie in quegli anni a causa della siccità; la storia narra che al termine del percorso penitenziale un temporale si abbatté sulla città.</p>
                    
                    <h3>Caratteristiche</h3>
                    <p>Dove erano le croci oggi si trovano i cinque monumenti di cui è composto il complesso monumentale, in quanto due furono abbattuti per far posto alla Chiesa. Il complesso è formato da un arco trionfale in stile barocco, cinque cappelle e una chiesa con pianta a croce latina. All'interno della chiesa è conservata una reliquia del S. Legno della Croce di Gesù, e una tela di scuola napoletana che raffigura la Salita al Calvario. Al disotto della chiesa vi è una cripta dove sono custodite le spoglie dei soldati della I guerra mondiale, e dove si dice avvenissero le riunioni dei carbonari dauni durante il Risorgimento.</p>
                    <p>Monumento impresso per singolarità e particolarità. Fermarsi sotto le sue cappelle significa certamente respirare un po’ la vita dei pastori, rivivere i loro percorsi, immaginare le speranze di una città che cresceva intorno: tutto questo perchè la vita dei pastori non va disgiunta appunto dalla Chiesa delle Croci. Quando Alfonso d’Aragona, nel 1447, istituì la Dogana delle pecore, numerosi pastori della Puglia, della Basilicata e dell’Abruzzo scendevano nella pianura foggiana con decine di migliaia di greggi al pascolo. Ebbene, all’incrocio di due importanti tratturi, appena fuori la città di allora, nacque codesta Chiesa meta quindi di tutti questi forestieri che entravano in ogni luogo sacro che incontrassero lungo il loro lungo tragitto. Infatti sulla sommità dell’arco trionfale, da un lato del cornicione si legge una scritta in latino: “O vos omnes qui transitis per viam attendite et vidite si est dolor sicut dolor meus” (O voi che passate per questa via, ponete attenzione e vedete se c’è un dolore simile al mio).</p>
                    <p>Sembrerebbe che la costruzione della chiesa ebbe inizio nel 1615.</p>
                `;
                
                const fallbackEN = `
                    <h2>The Chapel of the Crosses</h2>
                    <p>The construction of the church dates back to 1693 and was erected on the site where the Capuchin father Antonio da Olivadi planted seven crosses along the route of a penitential procession[1]. This Way of the Cross was made to ward off the famine that was raging in the Tavoliere delle Puglie in those years due to drought; history tells that at the end of the penitential path a thunderstorm hit the city.</p>
                    
                    <h3>Characteristics</h3>
                    <p>Where the crosses once stood, today there are the five monuments that make up the monumental complex, as two were torn down to make way for the Church. The complex consists of a Baroque-style triumphal arch, five chapels, and a church with a Latin cross plan. Inside the church, a relic of the Holy Wood of the Cross of Jesus is preserved, along with a Neapolitan school canvas depicting the Ascent to Calvary. Below the church, there is a crypt where the remains of World War I soldiers are kept, and where it is said the meetings of the Daunian Carbonari took place during the Risorgimento.</p>
                    <p>A monument striking for its singularity and particularity. Stopping under its chapels certainly means breathing a little of the shepherds' life, reliving their journeys, imagining the hopes of a city growing around it: all this because the life of the shepherds cannot be separated from the Church of the Crosses. When Alfonso of Aragon established the Sheep Customs (Dogana delle pecore) in 1447, numerous shepherds from Apulia, Basilicata, and Abruzzo would descend into the Foggia plain with tens of thousands of flocks to pasture. Well, at the intersection of two important sheep tracks (tratturi), just outside the city of that time, this Church was born, thus becoming a destination for all these strangers who entered every sacred place they encountered along their long journey. In fact, at the top of the triumphal arch, on one side of the cornice, there is an inscription in Latin: "O vos omnes qui transitis per viam attendite et vidite si est dolor sicut dolor meus" (O all you who pass by this way, look and see if there is any sorrow like my sorrow).</p>
                    <p>It would seem that the construction of the church began in 1615.</p>
                `;
                
                textContainer.innerHTML = currentLanguage === 'IT' ? fallbackIT : fallbackEN;
            }
        }

                        <div class="gallery-thumbs">

                        </div>

            '3d': () => {

                            <div class="ratio-16-9">

        // Gestione cambio immagine galleria (Vanilla JS)
        window.changeGalleryImage = function(thumbElement, imgPath, fallbackUrl) {

            const mainImg = document.getElementById('main-gallery-img');

                document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
                e.currentTarget.classList.add('active');
                if (action === 'home') {
                    goToMainHomePage();
                    return;

                // Renderizza contenuto
                if(renderFunctions[action]) {

                if (menu.classList.contains('open')) {
                    toggleMenu();

        window.addEventListener('DOMContentLoaded', () => {

        /* ── PAGE TRANSITIONS & FLUIDITY ── */

            document.addEventListener('click', function (e) {

                var href = link.getAttribute('href');
                if (!href || href.startsWith('#') || href.startsWith('javascript') ||
                    href.startsWith('http') || link.target === '_blank') return;
                e.preventDefault();
                overlay.classList.add('active');
                setTimeout(function () {
                    window.location.href = href;
                }, 260);
            });

            // Fade-in quando si arriva sulla pagina
            document.addEventListener('DOMContentLoaded', function () {
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity .35s ease';
                setTimeout(function () { document.body.style.opacity = '1'; }, 20);
            });

            // Smooth content-panel fade per switch sezioni (riquadro-3)
            var r3 = document.getElementById('riquadro-3');
            if (r3) {
                var origInner = r3.innerHTML;
                var observer = new MutationObserver(function () {
                    r3.style.opacity = '0';
                    r3.style.transform = 'translateY(6px)';
                    setTimeout(function () {
                        r3.style.transition = 'opacity .3s ease, transform .3s ease';
                        r3.style.opacity = '1';
                        r3.style.transform = 'translateY(0)';
                    }, 10);
                });
                observer.observe(r3, { childList: true, subtree: false });
            }
        })();

    </script>

<div id="page-transition"></div>

                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
        Scegli un altro percorso
    </a>
