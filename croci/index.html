                    <h3>Capitolo 2: Sviluppo urbanistico e toponomastica del Borgo Croci</h3>
                    <p>Il tracciato urbano di Borgo Croci nacque in maniera disordinata, riflettendo le circostanze precarie della sua formazione. A differenza dei quartieri pianificati, il borgo sorse senza un piano regolare: le strade non erano parallele, ma si intrecciavano in vicoli e vicoletti tortuosi, formando quasi una "ragnatela" intricata. Non esistevano allineamenti né larghezze costanti delle vie; spesso anche le facciate opposte di una stessa stretta via non risultavano parallele tra loro. Piccoli slarghi e piazzette nacquero solo per casualità, ad esempio dove qualcuno aveva lasciato uno spazio o dove una baracca era crollata, piuttosto che per un disegno viario coerente. Questa confusione urbanistica è ben documentata: "Borgo Croci è sorto sempre affrettatamente, a carattere di precarietà" - scrive un autore locale - in più fasi successive, con costruzioni tirate su "nell'anarchia più assoluta, sotto l'incubo della paura e della fretta" dopo i grandi terremoti. Ognuno costruiva dove poteva, rispettando appena il vicino che si era sistemato prima; nacquero così fronti edilizi discontinui, tutti ad un solo piano ma di altezze diverse, usando i materiali più vari e spesso di recupero. Questo impianto spontaneo e disorganico ha lasciato un'impronta duratura nella topografia del rione, visibile persino dopo i successivi interventi di consolidamento e ristrutturazione parziale delle case.</p>
                    <p>Nonostante l'irregolarità, col tempo il borgo si integrò parzialmente al tessuto urbano di Foggia. Le mappe ottocentesche mostrano l'estensione del quartiere. Ad esempio, la Pianta Mongelli (una dettagliata topografia di Foggia redatta intorno al 1840) evidenzia che, verso Nord-Ovest, l'abitato si prolungava ormai fino alla Chiesa delle Croci, pur senza spingersi oltre in direzione del vecchio Convento dei Cappuccini. Ciò indica che a metà Ottocento Borgo Croci era un rione consolidato attorno al Santuario, mentre la campagna aperta iniziava subito dopo. A Sud e Ovest, il quartiere confinava con le ultime case di via Fuiani e con il Piano delle Fosse granarie, un'altra area caratteristica della Foggia pre-moderna.</p>

                    <p>Nel corso del Novecento, Borgo Croci ha subito ulteriori trasformazioni urbanistiche. Negli anni Trenta del XX secolo sorsero palazzine popolari note come "case di Mussolini". Tuttavia, il problema delle condizioni igienico-sanitarie del borgo restava grave. Dopo la Seconda guerra mondiale, le autorità individuarono Borgo Croci come area da riqualificare. Il "risanamento" culminò negli anni Settanta con un vasto intervento: furono demoliti gran parte dei vecchi edifici e vennero costruiti nuovi complessi di case popolari. L'operazione coinvolse 650 nuovi alloggi finanziati dall'IACP e rappresentò l'opera pubblica più importante realizzata in città. Il risultato fu la trasformazione radicale del tessuto edilizio: al posto delle vecchie casupole sorse un quartiere più moderno, sebbene a prezzo della perdita di parte dell'antico ambiente pittoresco. Rimasero intatte le emergenze monumentali storiche (il Santuario delle Croci e la chiesa di S. Anna).</p>

                    <p>Sin dalle sue origini, Borgo Croci ebbe una popolazione a forte connotazione popolare. Gli abitanti storici del quartiere erano noti col nome di "terrazzani". Si trattava di nuclei di poveri braccianti giornalieri, raccoglitori e cacciatori che vivevano ai margini della società cittadina. Fonti locali li descrivono come famiglie che campavano vendendo in città i frutti spontanei raccolti nelle campagne e arrotondavano con la caccia di frodo di piccola selvaggina e lumache. Non avendo terreni da coltivare né mestiere fisso, i terrazzani conducevano un'economia di sussistenza. Molti vivevano con il loro asino, che li accompagnava nel trasporto in città di erbe, legna o selvaggina.</p>
                    <p>Borgo Croci divenne storicamente il quartiere dei terrazzani. Una testimonianza della prima metà dell'Ottocento attesta chiaramente questa ripartizione sociale: i carrettieri si concentravano nel borgo di Gesù e Maria, i contadini a sud-est, mentre Borgo Croci era sinonimo di quel sottoproletariato urbano privo di terra. I terrazzani foggiani costituivano quasi una comunità a sé: vestivano in modo umile, parlavano un dialetto infarcito di espressioni locali e spesso erano guardati con sospetto dal resto della cittadinanza. Lo storico locale Carlo Villani li definì un' "indegna plebaglia facile a maneggiare coltelli e volontariamente ghettizzata nel rione Croci". In effetti, per lungo tempo i crocesi mostrarono un forte attaccamento identitario al borgo, al punto da esitare a trasferirsi altrove anche durante il risanamento degli anni '70.</p>

                    <h2>The Borgo Croci District of Foggia: Origins, Urban Development, and Social Life</h2>

                    <p>Foggia, the capital of Capitanata in Apulia, has seen over time the formation of various historical districts outside its original medieval core. Already from the 18th century, spontaneous popular neighborhoods arose outside the city walls, often in correspondence with transit routes or extra-urban places of worship. One of these is Borgo Croci (also known as the Croci district), still considered today "the district richest in history and traditions of the city", to the point that its inhabitants were called 'crocesi' even before 'foggiani'. This research reconstructs in detail the history of Borgo Croci: from the origins of the first settlement, to the subsequent urban development with toponymic changes, up to the social and cultural aspects (trades, religious traditions, community life) that characterized the district. Finally, a chapter is dedicated to the historical families of the neighborhood and the most significant surnames, based on available documentary sources. The aim is to provide a complete report based on reliable historical sources, favoring local studies, archival documents, and academic publications, while excluding anecdotes without documentary evidence.</p>

                    <h3>Chapter 1: Origins of the Croci District</h3>
                    <p>The Borgo Croci district arose outside the ancient settlement of Foggia, in an initially rural and strategic area. Before its formation, the Tavoliere plain stretched out here, crossed by important transhumance routes. Right here converged two royal sheep tracks coming from Abruzzo, the L'Aquila-Foggia and the Celano-Foggia, which ended at the gates of the city. Testifying to the importance of this crossroads is the Epitaffio, a monument erected in 1651 at the end of the current Via Alessandro Manzoni (near Piazza Sant'Eligio) to mark the arrival point of the royal tracks. The Epitaffio bears a commemorative inscription of the completion of the "reintegration" of the track borders under the Spanish King Philip IV, confirming the historical value of this place linked to pastoralism and cattle trade.</p>
                    <p>However, it was a religious event, linked to popular devotion, that initiated the first residential nucleus. In 1693, the Capuchin father Antonio da Olivati (or Olivadi) arrived in Foggia during a severe drought that was causing famine in the Tavoliere. He then organized a penitential procession outside the city, planting seven votive crosses along the route. Tradition reports that at the end of the Way of the Cross, a thunderstorm miraculously struck, ending the drought. As a sign of thanksgiving, the Calvary Complex, known as the Church of the Crosses (Chiesa delle Croci), was built on the site of the procession. Within a few years, the area of the crosses was spontaneously fenced off by the people, and five chapels were built over the seven crosses (two crosses were removed to make way for the church) along with a Baroque church and a monumental triumphal arch. The church, officially named the "Royal Temple of Mount Calvary under the title of the Holy Cross", was built starting in 1693, blessed in 1742, and opened to worship in 1879. Inside it preserves a large eighteenth-century canvas (the Ascent to Calvary, Neapolitan school) and a relic of the Wood of the Cross of Christ. This unique open-air sanctuary, later declared a National Monument, soon became the devotional heart of the area. Around it formed one of the first extra-moenia (outside the walls) city nuclei, later called Borgo Croci.</p>

                    <h3>Chapter 2: Urban Development and Toponymy of Borgo Croci</h3>
                    <p>The urban layout of Borgo Croci was born in a disorderly manner, reflecting the precarious circumstances of its formation. Unlike planned neighborhoods, the village arose without a regular plan: the streets were not parallel but intertwined in tortuous alleys and narrow lanes, forming almost an intricate "spider web". There were no alignments or constant widths of the streets; often even the opposite facades of the same narrow street were not parallel to each other. Small clearings and little squares were born only by chance, for example where someone had left a space or where a shack had collapsed, rather than by a coherent road design. This urban confusion is well documented: "Borgo Croci has always arisen hastily, with a character of precariousness" - writes a local author - in successive phases, with buildings thrown up "in absolute anarchy, under the nightmare of fear and haste" after the great earthquakes. Everyone built where they could, barely respecting the neighbor who had settled first; thus discontinuous building fronts were born, all single-story but of different heights, using the most varied and often recovered materials. This spontaneous and disorganized layout has left a lasting imprint on the topography of the district, visible even after subsequent interventions of consolidation and partial restructuring of the houses.</p>

                    <p>Since its origins, Borgo Croci had a population with a strong popular connotation. The historical inhabitants of the district were known by the name of "terrazzani". These were nuclei of poor daily laborers, gatherers, and hunters who lived on the margins of city society. Local sources describe them as families who made a living selling spontaneous fruits gathered in the countryside in the city and supplemented their income with the poaching of small game and snails. Having neither land to cultivate nor a fixed trade, the terrazzani led a subsistence economy. Many lived with their donkey, which accompanied them in transporting herbs, wood, or game to the city.</p>

        // Gestione cambio immagine galleria (Vanilla JS)
        window.changeGalleryImage = function(thumbElement, imgPath, fallbackUrl) {
            // Aggiorna immagine grande
            const mainImg = document.getElementById('main-gallery-img');
            mainImg.src = imgPath;
            // Aggiorna fallback in caso manchi l'asset
            mainImg.onerror = function() { 
                this.onerror=null; 
                this.src = fallbackUrl; 
            };
            // Gestisci classe active sulle miniature
            document.querySelectorAll('.gallery-thumbs .thumb').forEach(t => t.classList.remove('active'));
            thumbElement.classList.add('active');
        };
        function setActiveAction(action) {
            document.querySelectorAll('.menu-item[data-action], .section-option[data-action]').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-action') === action);
            });
        }

        // Event listener per voci di menu (drawer + header fisso sezioni)
        document.querySelectorAll('.menu-item[data-action], .section-option[data-action]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const action = e.currentTarget.getAttribute('data-action');
                
                // Rimuovi active a tutti e mettilo a quello cliccato
                document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
                e.currentTarget.classList.add('active');
                if (action === 'home') {
                    goToMainHomePage();
                    return;
                }

                // Renderizza contenuto
                if(renderFunctions[action]) {
                    renderFunctions[action]();
                }

                if (menu.classList.contains('open')) {
                    toggleMenu();
                }
            });
        });
        // Home: porta alla pagina principale del progetto
        function goToMainHomePage() {
            window.location.href = '../pagina home/index.html';
        }

        // Tasto home nell'header
        document.getElementById('btn-home').addEventListener('click', goToMainHomePage);
        /* ==========================================================================
           6. INIZIALIZZAZIONE APP
           ========================================================================== */
        window.addEventListener('DOMContentLoaded', () => {
            initLanguage();
            renderFunctions.home(); // Carica immagine copertina all'avvio
        });
    

        /* ── PAGE TRANSITIONS & FLUIDITY ── */
        (function () {
            // Crea overlay transizione
            var overlay = document.getElementById('page-transition');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'page-transition';
                document.body.appendChild(overlay);
            }

            // Intercetta click su link che escono dalla pagina
            document.addEventListener('click', function (e) {
                var link = e.target.closest('a[href]');
                if (!link) return;
                var href = link.getAttribute('href');
                if (!href || href.startsWith('#') || href.startsWith('javascript') ||
                    href.startsWith('http') || link.target === '_blank') return;
                e.preventDefault();
                overlay.classList.add('active');
                setTimeout(function () {
                    window.location.href = href;
                }, 260);
            });

            // Fade-in quando si arriva sulla pagina
            document.addEventListener('DOMContentLoaded', function () {
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity .35s ease';
                setTimeout(function () { document.body.style.opacity = '1'; }, 20);
            });

            // Smooth content-panel fade per switch sezioni (riquadro-3)
            var r3 = document.getElementById('riquadro-3');
            if (r3) {
                var origInner = r3.innerHTML;
                var observer = new MutationObserver(function () {
                    r3.style.opacity = '0';
                    r3.style.transform = 'translateY(6px)';
                    setTimeout(function () {
                        r3.style.transition = 'opacity .3s ease, transform .3s ease';
                        r3.style.opacity = '1';
                        r3.style.transform = 'translateY(0)';
                    }, 10);
                });
                observer.observe(r3, { childList: true, subtree: false });
            }
        })();

    </script>
